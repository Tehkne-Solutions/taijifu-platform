name: Migrate Taijifu Production Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MIGRATE_TAIJIFU_PROD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'MIGRATE_TAIJIFU_PROD' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:preflight
      - name: Apply tracked migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
