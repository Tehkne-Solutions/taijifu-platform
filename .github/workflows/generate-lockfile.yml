name: Generate pnpm lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: pnpm install --lockfile-only
      - name: Emit lockfile payload
        run: |
          echo 'TAIJIFU_LOCKFILE_BASE64_BEGIN'
          base64 -w0 pnpm-lock.yaml
          echo
          echo 'TAIJIFU_LOCKFILE_BASE64_END'
