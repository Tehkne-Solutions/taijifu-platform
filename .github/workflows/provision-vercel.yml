name: Provision Taijifu Vercel Projects

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create missing Vercel projects"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  VERCEL_TEAM_ID: team_GAFmMllTKaWx5iGEa8sTZJ0T

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify required credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN secret is missing" && exit 1)
      - name: Provision Site and Academy projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TAIJIFU_VERCEL_APPLY: ${{ inputs.apply }}
        run: node tooling/provision-vercel-projects.mjs
