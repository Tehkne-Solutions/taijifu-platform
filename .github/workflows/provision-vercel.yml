name: Provision Taijifu Vercel Projects

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create missing Vercel projects"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN secret is missing" && exit 1)
          test -n "$VERCEL_TEAM_ID" || (echo "VERCEL_TEAM_ID repository variable is missing" && exit 1)
      - name: Provision Site and Academy projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          TAIJIFU_VERCEL_APPLY: ${{ inputs.apply }}
        run: node tooling/provision-vercel-projects.mjs
