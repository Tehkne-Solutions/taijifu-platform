name: Check Taijifu Production Externals

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_TEAM_ID: team_GAFmMllTKaWx5iGEa8sTZJ0T
  TAIJIFU_ENABLE_DEMO_AUTH: "false"

jobs:
  externals-ready:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check external provisioning
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          TAIJIFU_AUTH_BRIDGE_SECRET: ${{ secrets.TAIJIFU_AUTH_BRIDGE_SECRET }}
        run: pnpm production:externals-ready
      - name: Verify PostgreSQL connectivity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:preflight
      - name: External readiness summary
        run: echo "TAIJIFU_EXTERNALS_GATE=PASS"
